<header class="header">
  <div class="page-container header__inner">
    <!-- The official SPÜLBOY® ORIGINAL artwork, served from public/ -->
    <a class="logo" href="#top" aria-label="SPÜLBOY® ORIGINAL — back to the top of the page">
      <img src="/spulboy-logo.png" alt="SPÜLBOY ORIGINAL" width="760" height="433" />
    </a>

    <!-- Primary navigation; below 1024px it collapses into the menu button -->
    <nav class="nav" id="primary-navigation" [class.nav--open]="menuOpen()" aria-label="Primary">
      <ul>
        @for (link of links; track link.href) {
          <li><a [href]="link.href" (click)="closeAll()">{{ link.label }}</a></li>
        }
      </ul>
    </nav>

    <button
      type="button"
      class="header__burger"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-navigation"
      (click)="toggleMenu()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        @if (menuOpen()) {
          <path d="m6 6 12 12M18 6 6 18" />
        } @else {
          <path d="M4 7h16M4 12h16M4 17h16" />
        }
      </svg>
      <span class="sr-only">{{ menuOpen() ? 'Close the menu' : 'Open the menu' }}</span>
    </button>
  </div>
</header>
